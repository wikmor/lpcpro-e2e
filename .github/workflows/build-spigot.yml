name: Build & Release Spigot

on:
  workflow_dispatch:
    inputs:
      versions:
        description: "Spigot versions to build (comma- or space-separated)"
        required: false
        default: "1.12.2, 1.16.5, 1.21.5"

  schedule:
    - cron: "0 3 * * 0"  # Every Sunday at 03:00 UTC

env:
  DEFAULT_VERSIONS: "1.12.2 1.16.5 1.21.5"
  BUILDTOOLS_URL: "https://hub.spigotmc.org/jenkins/job/BuildTools/lastSuccessfulBuild/artifact/target/BuildTools.jar"

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - id: set-matrix
        run: |
          VERSIONS="${{ github.event.inputs.versions || env.DEFAULT_VERSIONS }}"
          CLEANED=$(echo "$VERSIONS" | tr ',' ' ')

          MATRIX_JSON="["
          for VER in $CLEANED; do
            if [[ "$VER" == 1.8.* || "$VER" == 1.9.* || "$VER" == 1.10.* || "$VER" == 1.11.* || "$VER" == 1.12.* ]]; then
              JAVA_VER="8"
            elif [[ "$VER" == 1.13.* || "$VER" == 1.14.* || "$VER" == 1.15.* ]]; then
              JAVA_VER="11"
            elif [[ "$VER" == 1.16.* ]]; then
              JAVA_VER="16"
            elif [[ "$VER" == 1.17.* || "$VER" == 1.18.* || "$VER" == 1.19.* || "$VER" == 1.20.* ]]; then
              JAVA_VER="17"
            else
              JAVA_VER="21"
            fi
            MATRIX_JSON+="{\"version\":\"$VER\",\"java\":\"$JAVA_VER\"},"
          done
          MATRIX_JSON="${MATRIX_JSON%,}]"
          echo "matrix=$MATRIX_JSON" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.matrix) }}

    permissions:
      contents: write  # Required for creating releases

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java }}

      - name: Download BuildTools
        run: |
          mkdir -p buildtools/${{ matrix.version }}
          curl -sLo buildtools/${{ matrix.version }}/BuildTools.jar "$BUILDTOOLS_URL"

      - name: Build Spigot ${{ matrix.version }}
        run: |
          mkdir -p spigot/${{ matrix.version }}
          cd buildtools/${{ matrix.version }}
          java -jar BuildTools.jar --rev ${{ matrix.version }} --compile Spigot
          mv spigot-${{ matrix.version }}.jar ../../spigot/${{ matrix.version }}/

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: spigot-${{ matrix.version }}
          name: Spigot ${{ matrix.version }}
          body: Built automatically using BuildTools on GitHub Actions.
          draft: false
          prerelease: false
          files: spigot/${{ matrix.version }}/spigot-${{ matrix.version }}.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
