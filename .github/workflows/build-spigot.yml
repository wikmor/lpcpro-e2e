name: Build & Release Spigot

on:
  workflow_dispatch:
    inputs:
      versions:
        description: "Spigot versions to build (space-separated or comma-separated)"
        required: false
        default: "1.8.8 1.12.2 1.16.5 1.21.5"

  # Automatic run every Sunday at 03:00 UTC
  schedule:
    - cron: "0 3 * * 0"

env:
  DEFAULT_VERSIONS: "1.8.8 1.12.2 1.16.5 1.21.5"
  BUILDTOOLS_URL: "https://hub.spigotmc.org/jenkins/job/BuildTools/lastSuccessfulBuild/artifact/target/BuildTools.jar"

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - id: set-matrix
        run: |
          VERSIONS="${{ github.event.inputs.versions || env.DEFAULT_VERSIONS }}"
          CLEANED=$(echo "$VERSIONS" | tr ',' ' ' | xargs -n1 | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "matrix={\"version\":$CLEANED}" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.prepare.outputs.matrix).version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch BuildTools
        run: |
          mkdir -p buildtools/${{ matrix.version }}
          curl -sLo buildtools/${{ matrix.version }}/BuildTools.jar "$BUILDTOOLS_URL"

      - name: Build Spigot ${{ matrix.version }}
        run: |
          mkdir -p spigot/${{ matrix.version }}
          cd buildtools/${{ matrix.version }}
          java -jar BuildTools.jar --rev ${{ matrix.version }} --compile Spigot
          mv spigot-${{ matrix.version }}.jar ../../spigot/${{ matrix.version }}/
        env:
          MAVEN_OPTS: -Dmaven.wagon.httpconnectionManager.ttlSeconds=30

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: spigot-${{ matrix.version }}
          name: Spigot ${{ matrix.version }}
          body: Built automatically using BuildTools on GitHub Actions.
          draft: false
          prerelease: false
          files: spigot/${{ matrix.version }}/spigot-${{ matrix.version }}.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
